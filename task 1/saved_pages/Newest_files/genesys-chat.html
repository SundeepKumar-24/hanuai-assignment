    <script type="text/javascript">
      const genesysPostEvents = {
        MESSENGER_OPENED: "GENESYS_MESSENGER_OPENED",
        MESSENGER_CLOSED: "GENESYS_MESSENGER_CLOSED",
        LAUNCHER_OPENED: "GENESYS_LAUNCHER_OPENED",
        LAUNCHER_CLOSED: "GENESYS_LAUNCHER_CLOSED",
        SCRIPT_INITIALIZED: "GENESYS_SCRIPT_INITIALIZED",
        LAUNCHER_READY: "GENESYS_LAUNCHER_READY",
      };

      const genesysListenerEvents = {
        OPEN_GENESYS_CHAT: "OPEN_GENESYS_CHAT",
        CLOSE_GENESYS_CHAT: "CLOSE_GENESYS_CHAT",
        DESKTOP_VIEW: "GENESYS_DESKTOP_VIEW",
        MOBILE_VIEW: "GENESYS_MOBILE_VIEW",
        DATABASE_SET: "GENESYS_DATABASE_SET",
      };

      const genesysCommands = {
        MESSENGER_OPEN: "Messenger.open",
        MESSENGER_CLOSE: "Messenger.close",
        MESSENGER_OPENED: "Messenger.opened",
        MESSENGER_CLOSED: "Messenger.closed",
        LAUNCHER_OPENED: "Launcher.visible",
        LAUNCHER_CLOSED: "Launcher.hidden",
        DATABASE_SET: "Database.set",
        LAUNCHER_READY: "Launcher.ready",
      };

      const DESKTOP_STYLE_VIEW = "desktop-bby";
      const MOBILE_STYLE_VIEW = "mobile-bby";
      const TARGET_ORIGIN = "*";

      (function () {
        const genesys = window.Genesys;

        window.onload = function () {
          window.parent.postMessage(
            { eventName: genesysPostEvents.SCRIPT_INITIALIZED },
            TARGET_ORIGIN
          );
        };

        genesys("subscribe", genesysCommands.MESSENGER_OPENED, function () {
          window.parent.postMessage(
            { eventName: genesysPostEvents.MESSENGER_OPENED },
            TARGET_ORIGIN
          );
        });
        genesys("subscribe", genesysCommands.MESSENGER_CLOSED, function () {
          window.parent.postMessage(
            { eventName: genesysPostEvents.MESSENGER_CLOSED },
            TARGET_ORIGIN
          );
        });

        genesys("subscribe", genesysCommands.LAUNCHER_OPENED, function () {
          window.parent.postMessage(
            { eventName: genesysPostEvents.LAUNCHER_OPENED },
            TARGET_ORIGIN
          );
        });

        genesys("subscribe", genesysCommands.LAUNCHER_CLOSED, function () {
          window.parent.postMessage(
            { eventName: genesysPostEvents.LAUNCHER_CLOSED },
            TARGET_ORIGIN
          );
        });

        genesys("subscribe", genesysCommands.LAUNCHER_READY, function () {
          window.parent.postMessage(
            { eventName: genesysPostEvents.LAUNCHER_READY },
            TARGET_ORIGIN
          );
        });

        window.addEventListener("message", function (event) {
          if (event.data && event.data.eventName) {
            event.preventDefault();
            event.stopPropagation();
            switch (event.data.eventName) {
              case genesysListenerEvents.OPEN_GENESYS_CHAT:
                openGenesysChat();
                break;
              case genesysListenerEvents.CLOSE_GENESYS_CHAT:
                closeGenesysChat();
                break;
              case genesysListenerEvents.MOBILE_VIEW:
                toggleStyle(document, DESKTOP_STYLE_VIEW, false);
                toggleStyle(document, MOBILE_STYLE_VIEW, true);
                break;
              case genesysListenerEvents.DESKTOP_VIEW:
                toggleStyle(document, DESKTOP_STYLE_VIEW, true);
                toggleStyle(document, MOBILE_STYLE_VIEW, false);
                break;
              case genesysListenerEvents.DATABASE_SET:
                databaseSet(event.data.customAttributes);
                break;
            }
          }
        });

        addStylesToIframe();

        function addStylesToIframe() {
          const iframeDocument = document;

          const desktopStyle = iframeDocument.createElement("style");
          desktopStyle.dataset.view = DESKTOP_STYLE_VIEW;
          desktopStyle.innerHTML = `
                        #genesys-mxg-container-frame {
                            left: unset !important;
                            bottom: 84px !important;
                            width: 426px !important;
                            height: calc(100% - 84px) !important;
                            right: 0px !important
                        }
            
                        #genesys-mxg-frame {
                            bottom: 0px !important;
                            right: 0px !important;
                        }
                    `;
          iframeDocument.head.appendChild(desktopStyle);

          const mobileStyle = iframeDocument.createElement("style");
          mobileStyle.dataset.view = MOBILE_STYLE_VIEW;
          mobileStyle.innerHTML = `
                        #genesys-mxg-container-frame {
                            width: 100% !important;
                            left: 0px !important;
                            right: 0px !important;
                            bottom: 0px !important;
                        }
            
                        #genesys-mxg-frame {
                            bottom: 0px !important;
                            right: 0px !important;
                        }
                    `;
          iframeDocument.head.appendChild(mobileStyle);
        }

        function toggleStyle(iframeDocument, view, shouldEnable) {
          const styles = iframeDocument.head.querySelectorAll("style");

          styles.forEach((style) => {
            if (style.dataset.view === view) {
              style.disabled = !shouldEnable;
            }
          });
        }

        function openGenesysChat() {
          window.Genesys("command", genesysCommands.MESSENGER_OPEN);
        }

        function closeGenesysChat() {
          window.Genesys("command", genesysCommands.MESSENGER_CLOSE);
        }

        function databaseSet(customAttributes) {
          if (customAttributes) {
            window.Genesys(
              "command",
              genesysCommands.DATABASE_SET,
              { messaging: { customAttributes } },
              function () {},
              function () {
                console.error(
                  "Error setting custom attributes in Genesys Messenger"
                );
              }
            );
          } else {
            console.error(
              "No custom attributes provided for Genesys Messenger"
            );
          }
        }
      })();
    </script>
